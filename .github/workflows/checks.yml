name: Reference and harness checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check catalog and generated documentation
        run: python scripts/check-catalog.py
      - name: Check harness with synthetic fixtures
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check shell syntax
        run: bash -n scripts/probe.sh scripts/run-sam-scenario.sh
