name: Reference and harness checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check catalog and generated documentation
        run: python scripts/check-catalog.py
      - name: Check harness with synthetic fixtures
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check shell syntax
        run: bash -n scripts/probe.sh scripts/run-sam-scenario.sh
