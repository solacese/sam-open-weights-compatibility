# Illustrative Python SAM fragment; merge into a working project configuration.
# Broker, namespace, gateway and runtime-specific settings come from that project.
# This is not a standalone deployment or a universal Go/Python configuration.
apps:
  - name: model_validation_agent
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection  # define this anchor in your project's combined YAML
    app_config:
      agent_name: ModelValidationAgent
      namespace: ${NAMESPACE}
      model:
        model: ${SAM_TEST_MODEL}
        api_base: ${SAM_TEST_API_BASE}
        api_key: ${SAM_TEST_API_KEY}
        max_tokens: 4096
      instruction: |
        For a shipping question, call lookup_order first, then use its returned
        warehouse in get_shipping_estimate. Report both days and cost.
        Treat the warehouse as opaque; never invent it.
      session_service:
        type: memory
      artifact_service:
        type: memory
      tools:
        - tool_type: python
          component_base_path: ./tests/tools
          component_module: validation_tools
          function_name: lookup_order
          tool_name: lookup_order
        - tool_type: python
          component_base_path: ./tests/tools
          component_module: validation_tools
          function_name: get_shipping_estimate
          tool_name: get_shipping_estimate
