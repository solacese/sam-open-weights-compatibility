name: parallel-tools
prompt: |
  Look up orders ORD-1001 and ORD-1002 together and tell me the item in each.
assertions:
  lookup_orders: [ORD-1001, ORD-1002]
  calls_in_same_assistant_turn: true
  both_calls_before_any_result: true
  unique_call_ids: true
  final_answer_contains_both_observed_items: true
# Serial correctness is useful but does not pass this parallel-capability check.
