# Behavioral specification; the live trace checker implements these assertions.
name: two-tool-dependency
prompt: |
  I need the shipping estimate for order ORD-1001 to Copenhagen. Give days and EUR cost.
assertions:
  tool_calls_in_order: [lookup_order, get_shipping_estimate]
  first_arguments: {order_id: ORD-1001}
  second_call_after_first_result: true
  warehouse_matches_observed_lookup_result: true
  destination: Copenhagen
  shipping_result: {days: 1, cost_eur: 4.90}
  final_answer_contains_cost_and_duration: true
